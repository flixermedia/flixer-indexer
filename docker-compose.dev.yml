# Dedicated Redis for local development. Run the indexer itself with `go run ./cmd/flixer-indexer`
# (REDIS_ADDR=localhost:6379, the default).
services:
    redis:
        image: redis:7-alpine
        restart: unless-stopped
        ports:
            - "${REDIS_PORT:-6379}:6379"
        volumes:
            - redis-dev-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 3s
            retries: 5

volumes:
    redis-dev-data:
